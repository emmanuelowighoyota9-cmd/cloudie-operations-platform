<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/app-icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Cloudie Operations is a unified operations platform for shipments, tracking, documents, payments and airtime, drawn on one points balance." />
  <!-- Matches --background in the daylight theme. The app rewrites this to the
       active palette's background once the theme is resolved. -->
  <meta name="theme-color" content="#f6f6f4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cloudie Operations" />
  <!-- Canonical production host. The build is served from a VPS behind nginx
       with a Let's Encrypt certificate (see deploy/README.md) while Convex stays
       the backend. Share links and payment callbacks use window.location.origin,
       so they follow whichever host serves the build. -->
  <link rel="canonical" href="https://cloudie.wuaze.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cloudie Operations" />
  <meta property="og:title" content="Cloudie Operations · Unified operations platform" />
  <meta
    property="og:description"
    content="Book, track and document shipments, with airtime and bill payments drawn on the same points balance."
  />
  <meta property="og:url" content="https://cloudie.wuaze.com/" />
  <meta name="twitter:card" content="summary" />
  <title>Cloudie Operations · Unified operations platform</title>
  <!-- Paints the right palette before React mounts, so a visitor who chose dark
       never sees a white flash (and vice versa). `ThemeProvider` takes over
       once the administrator's default theme is known. -->
  <script>
    (function () {
      var theme = "light";
      try {
        var stored = localStorage.getItem("cloudie-theme");
        if (stored === "light" || stored === "dark") {
          theme = stored;
        } else if (
          stored === "system" &&
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          theme = "dark";
        }
      } catch (error) {
        /* Storage blocked — the daylight default is fine. */
      }
      var root = document.documentElement;
      root.classList.add(theme);
      root.style.colorScheme = theme;
      if (theme === "dark") {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#000000");
      }
    })();
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
